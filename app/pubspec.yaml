name: guryongpo_safety
description: Guryongpo multi-disaster response prototype for Android, iOS and Web.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  firebase_messaging: ^15.2.10
  geolocator: ^13.0.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.2
  record: ^7.1.1
  audioplayers: ^6.8.1
  flutter_local_notifications: ^19.5.0
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # 디자인 = web-prototype (2026-10-08). AI 대화 캐릭터 '모리'
  assets:
    - assets/mori-face.png
  # Pretendard (SIL OFL 1.1, assets/fonts/Pretendard-OFL.txt) — 한국어 2,350자 + 영문·기호로 줄인 것 (굵기당 약 420KB)
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
        - asset: assets/fonts/Pretendard-ExtraBold.otf
          weight: 800
