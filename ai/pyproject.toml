[project]
name = "guardian-ai"
version = "0.1.0"
description = "구룡가디언 AI agent (LangGraph multi-agent)"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "pydantic>=2.7",
    "openai>=3.22",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["guardian_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# live: 실제 OpenAI를 부르는 테스트. 기본 실행에서 제외, `pytest -m live`로 따로 돌린다 (OPENAI_API_KEY 필요)
markers = ["live: 실제 OpenAI API 호출 (OPENAI_API_KEY 필요)"]
addopts = "-m 'not live'"
