[project]
name = "guardian-ai"
version = "0.1.0"
description = "구룡가디언 AI agent (LangGraph multi-agent)"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    # LangSmith 추적 (선택, guardian_ai/tracing.py). langgraph가 이미 끌어오지만 직접 import하므로 적는다
    "langsmith>=0.3",
    "pydantic>=2.7",
    "openai>=3.22",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "langgraph-checkpoint-postgres>=3.1",
    # 음성 (B5): Google Speech-to-Text·Text-to-Speech REST를 서비스 계정 토큰으로 부른다 (무거운 gRPC 클라이언트 대신)
    "google-auth>=2.30",
    "requests>=2.31",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["guardian_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# live: 실제 OpenAI를 부르는 테스트. 기본 실행에서 제외, `pytest -m live`로 따로 돌린다 (OPENAI_API_KEY 필요)
# db: 로컬 DB(docker compose의 db, localhost:5433)에 실제로 붙는 테스트. `pytest -m db`로 따로 돌린다
markers = ["live: 실제 OpenAI API 호출 (OPENAI_API_KEY 필요)", "db: 로컬 DB 필요 (docker compose up -d db)"]
addopts = "-m 'not live and not db'"
