openapi: 3.1.0
info:
  title: 구룡가디언 API
  version: 0.3.0
  description: |
    구룡포 재난 지킴이 — 서버 3개(api · ai · route)의 통신 규약 (전 팀 공유용, 2026-10-03 v0.3 고정)

    ## 서비스 구성
    | 서비스 | 담당 | 로컬 주소 | 배포 (Caddy, 같은 도메인) | 이 문서의 경로 |
    |---|---|---|---|---|
    | api — 데이터·위험 판정·사용자·대피 | A | `localhost:8000/api/v1` | `/api/v1/*` | `/health` … `/admin/*` (기본 서버) |
    | ai — LangGraph 대화·음성 | B | `localhost:8001` | `/api/chat`, `/api/voice`, `/api/tts` | `/api/chat`, `/api/voice`, `/api/tts` (경로별 servers) |
    | route — GraphHopper 경로 | B | `localhost:8002` | `/api/route*` | `/api/route`, `/api/route/check`, `/api/route/sea` |

    ai·route 의 요청·응답은 각 서비스 코드(Pydantic 모델)가 원본이다. 이 문서는 그 모양을 그대로 옮겨 적은 것이며,
    바뀌면 B 가 이 문서도 같이 고친다. (v0.2 까지 api 에 있던 목업 `/chat`·`/voice`·`/route` 는 실제 서비스와 형식이 달라 v0.3 에서 삭제)

    ## 공통 규약
    - 인증: Firebase 익명 로그인 → **Firebase ID 토큰**을 `Authorization: Bearer <idToken>` 로 전송.
      api 는 firebase-admin 으로 검증해 `uid` 로 사용자를 찾는다. `security: []` 인 경로만 토큰 없이 호출 가능.
      개발: api 를 `AUTH_MODE=dev` 로 띄우면 `Bearer dev:<uid>` 허용 (배포 금지).
    - 역할(role): `resident` 주민(기본) / `responder` 자율방재단 / `caregiver` 생활지원사 / `admin` 읍 담당자.
      주민이 앱에서 **초대 코드**를 입력하면(`POST /user/role`) 역할이 붙는다. `/admin/*` 는 responder·caregiver·admin 만.
      caregiver 는 자신이 담당(`caregiver_user_id`)인 가구만 본다. 권한이 없으면 403 `FORBIDDEN`.
    - 실시간 전달: 앱이 꺼져 있으면 **FCM 푸시**(`FcmPayload`), 켜져 있으면 **폴링**.
      주민 `GET /alerts` — 간격은 응답의 `next_poll_sec` (평상시 60초, 재난 모드 15초)
      방재단 `GET /admin/incidents/{id}` — `next_poll_sec` 10초. 같은 내용이 푸시와 폴링으로 모두 올 수 있으니 앱은 `id` 로 중복을 없앤다.
    - 대피 확인: 경고 중 `response_required=true` 인 것은 버튼 3개 — **대피 완료**(`evacuated`) / **대피 중**(`evacuating`) / **도움 필요**(`need_help`).
      알림 버튼·앱 대시보드·음성(B12) 모두 `POST /alerts/{alert_id}/response` 하나로 기록한다 (`via` 로 수단 구분).
    - 음성: 앱은 녹음 파일만 ai 서비스로 보낸다. STT·TTS 호출은 서버가 한다 (앱에 Google 키 없음). 형식은 `/api/voice`·`/api/tts` (B5, 2026-10-03).
    - 좌표: api 는 `{ "lat", "lng" }`, **ai·route 는 `{ "lat", "lon" }`** (서비스별로 다르니 주의). 지도 도형은 GeoJSON `[lng, lat]`.
      route 의 경로 선(`geometry`)은 GeoJSON 이 아니라 **인코딩된 polyline** (Google 형식, 정밀도 1e5).
    - 시각: ISO 8601, KST (`2026-10-05T14:30:00+09:00`)
    - 위험도 표기: api 응답은 `RiskItem` 하나만 사용 (hazard 코드 + level 코드 + level_num 0~4)
    - 개인정보: 취약 가구·대피 응답·방문 기록은 DB `care` 스키마 — api 만 읽고 쓴다 (AI 읽기 전용 계정은 접근 불가)
    - 에러: api 의 4xx/5xx 는 모두 `Error` 형식. 목업 응답에는 `X-Mock: true` 헤더. 목업 JSON 은 `server/mock/`
servers:
  - url: http://localhost:8000/api/v1
    description: api (A) 로컬. 배포는 https://<도메인>/api/v1

tags:
  - { name: health }
  - { name: user, description: 사용자 등록·인적사항·장소·비상연락처·역할 }
  - { name: household, description: '취약 가구 본인 등록 (주민 앱, 민감정보 동의 필수)' }
  - { name: device-token, description: FCM 토큰 등록 }
  - { name: dashboard, description: '맞춤형 대시보드, 지도 레이어, 긴급 전화' }
  - { name: risk, description: Risk engine 판정 결과 }
  - { name: alerts, description: '선제적 경고 (폴링) · 대피 확인 응답 (A5·A12)' }
  - { name: admin, description: '방재단·생활지원사 — 대피 현황·가구 관리·방문 기록 (A12~A14, B13)' }
  - { name: internal, description: '운영·시연용 (X-Internal-Token)' }
  - { name: ai, description: 'ai 서비스 (B) — 실제 경로 /api/chat, 서버 localhost:8001' }
  - { name: route, description: 'route 서비스 (B) — 실제 경로 /api/route*, 서버 localhost:8002' }

security:
  - firebaseAuth: []

paths:
  # ================================================================ health
  /health:
    get:
      tags: [health]
      summary: 서버·DB·수집기·경로엔진 상태
      operationId: getHealth
      security: []
      responses:
        '200':
          description: OK  (mock/health.json)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }

  # ================================================================ user
  /user:
    post:
      tags: [user]
      summary: 첫 실행 시 사용자 등록 (Firebase uid 기준, 이미 있으면 그대로 반환)
      operationId: registerUser
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileInput' }
      responses:
        '200':
          description: 이미 등록된 사용자
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '201':
          description: 새로 등록됨  (mock/user.json)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Error' }
    get:
      tags: [user]
      summary: 내 정보 (프로필 + 장소 + 비상연락처 + 온보딩 상태)
      operationId: getUser
      responses:
        '200':
          description: OK  (mock/user.json)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [user]
      summary: 인적사항 부분 수정 (보낸 필드만 변경. Agent가 대화 중 파악한 값도 사용자 확인 후 이 API로 저장)
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [user]
      summary: 탈퇴 — 개인정보 즉시 삭제
      operationId: deleteUser
      responses:
        '204': { description: 삭제됨 }
  /user/geocode:
    post:
      tags: [user]
      summary: 도로명 주소를 서버 측 카카오 API로 좌표 변환
      operationId: geocodeAddress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: { type: string, minLength: 1, maxLength: 300 }
      responses:
        '200':
          description: 정규화된 도로명 주소와 좌표
          content:
            application/json:
              schema:
                type: object
                required: [address, location]
                properties:
                  address: { type: string }
                  location: { $ref: '#/components/schemas/LatLng' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /user/app-state:
    get:
      tags: [user]
      summary: 앱 입력값 통째 조회 — 다른 기기에서 같은 계정으로 로그인하면 복원 (2026-10-05)
      operationId: getAppState
      responses:
        '200':
          description: 저장한 적 없으면 state null
          content:
            application/json:
              schema:
                type: object
                required: [state, updated_at]
                properties:
                  state: { type: [object, 'null'], description: '앱이 정한 형식 (서버는 해석하지 않음)' }
                  updated_at: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [user]
      summary: 앱 입력값 통째 저장 (덮어쓰기, 최대 64KB). 서버 판단용 값(출생연도·이동수단·장소 등)은 PATCH /user·/user/places 로 따로
      operationId: putAppState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state: { type: object }
      responses:
        '204': { description: 저장됨 }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /user/places:
    post:
      tags: [user]
      summary: 장소 등록 (집·직장·자주 가는 곳·숙소)
      operationId: addPlace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaceInput' }
      responses:
        '201':
          description: 등록됨 (정적 위험지역 포함 여부 계산해서 반환)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Place' }
  /user/places/{place_id}:
    parameters:
      - { name: place_id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [user]
      summary: 장소 수정
      operationId: updatePlace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlacePatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Place' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [user]
      summary: 장소 삭제
      operationId: deletePlace
      responses:
        '204': { description: 삭제됨 }
  /user/contacts:
    post:
      tags: [user]
      summary: 비상연락처 추가
      operationId: addContact
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmergencyContact' }
      responses:
        '201':
          description: 등록됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmergencyContact' }
  /user/contacts/{contact_id}:
    parameters:
      - { name: contact_id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      tags: [user]
      summary: 비상연락처 삭제
      operationId: deleteContact
      responses:
        '204': { description: 삭제됨 }
  /user/checklist/{item_id}:
    parameters:
      - { name: item_id, in: path, required: true, schema: { type: integer } }
    put:
      tags: [user]
      summary: 체크리스트 항목 체크
      operationId: checkItem
      responses:
        '204': { description: OK }
    delete:
      tags: [user]
      summary: 체크 해제
      operationId: uncheckItem
      responses:
        '204': { description: OK }

  /user/role:
    post:
      tags: [user]
      summary: 초대 코드로 역할 받기 (방재단·생활지원사·관리자)
      description: |
        읍사무소가 발급한 초대 코드를 입력하면 역할이 바뀐다. 코드는 서버에 해시로만 저장된다 (`care.invite_codes`).
        목업(AUTH_MODE=dev): `DEMO-RESPONDER` · `DEMO-CAREGIVER` · `DEMO-ADMIN` 이 각 역할, 그 외는 400 INVALID_INVITE.
      operationId: claimRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_code]
              properties:
                invite_code: { type: string, minLength: 4, maxLength: 64 }
      responses:
        '200':
          description: 역할 부여됨  (mock/role.json)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleGrant' }
        '400': { $ref: '#/components/responses/Error' }
    delete:
      tags: [user]
      summary: 역할 내려놓기 (주민으로 돌아감)
      operationId: dropRole
      responses:
        '204': { description: 주민(resident)으로 변경됨 }

  # ================================================================ household (주민 본인 등록)
  /user/household:
    get:
      tags: [household]
      summary: 내가 등록한 취약 가구 정보 (없으면 404)
      operationId: getMyHousehold
      responses:
        '200':
          description: OK  (mock/household.json)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Household' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [household]
      summary: 취약 가구로 본인 등록·수정 (민감정보 수집 동의 필수)
      description: |
        `consent=true` 가 없으면 422. 등록하면 대피 상황 때 방재단 화면에 표시되고 방문 우선순위 계산에 쓰인다.
        위치는 보통 등록 장소 '집'의 좌표를 그대로 보낸다.
      operationId: putMyHousehold
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SelfHouseholdInput' }
      responses:
        '200':
          description: 등록·수정됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Household' }
        '422': { $ref: '#/components/responses/Error' }
    delete:
      tags: [household]
      summary: 동의 철회 — 가구 정보와 그 가구의 대피 응답·방문 기록을 즉시 삭제
      operationId: deleteMyHousehold
      responses:
        '204': { description: 삭제됨 }

  # ================================================================ device-token
  /device-token:
    post:
      tags: [device-token]
      summary: FCM 토큰 등록·갱신 (앱 시작 시, onTokenRefresh 시 호출)
      operationId: registerDeviceToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token: { type: string, description: FCM registration token }
                platform: { $ref: '#/components/schemas/Platform' }
      responses:
        '200':
          description: OK  (mock/device-token.json)
          content:
            application/json:
              schema:
                type: object
                required: [device_id]
                properties:
                  device_id: { type: string, format: uuid, description: 'GET /alerts 폴링 시 함께 보내는 기기 ID' }
    delete:
      tags: [device-token]
      summary: FCM 토큰 해제 (로그아웃·알림 끄기)
      operationId: deleteDeviceToken
      parameters:
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        '204': { description: 해제됨 }

  # ================================================================ dashboard
  /dashboard:
    get:
      tags: [dashboard]
      summary: 맞춤형 대시보드 한 번에 조회
      description: |
        `mode` 는 서버가 결정한다. 현재 위치 또는 등록 장소에 advisory(주의보) 이상 위험이 있으면 `emergency`.
        emergency 이면 `widgets` 가 현재 재난 중심으로 재정렬되고 `highlight_layers` 가 지정된다.
        사용자 프로필의 이동수단과 등록 장소를 반영해 정보를 구성한다.
      operationId: getDashboard
      parameters:
        - $ref: '#/components/parameters/Lat'
        - $ref: '#/components/parameters/Lng'
      responses:
        '200':
          description: OK  (mock/dashboard.normal.json, mock/dashboard.emergency.json)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
  /dashboard/layers/{layer_id}:
    get:
      tags: [dashboard]
      summary: 지도 레이어 GeoJSON (대피소·의료시설·위험지역·맨홀·관측소·위험영역)
      description: |
        레이어별 Feature.properties
        - stations: { name, kind, source, metric, value, unit, source_level, source_level_label, level, observed_at, observed_label,
          stale, age_min, age_label, metrics, simulated }
          — 자료 신선도: 값은 수집 실패 때도 최근 성공값을 보여 주고 `age_label`("14:10 기준 · 50분 전 자료")을 같이 표시.
            유효 시간(수위계 40·대기 60·자외선 90·AWS 30분)을 넘으면 `stale=true` → 앱은 회색·"오래된 자료"
        - shelters: { id, name, shelter_types, address, capacity, phone, is_indoor, is_accessible, in_risk_area, unsuitable_for, unsuitable_reason }
          — in_risk_area = 대피소가 현재 주의 이상 위험 영역 안 (안내에서 제외)
          — unsuitable_for = 그 재난 때 권하지 않음. 지금은 ["landslide"] 만: 산사태위험지도 1등급 비탈 100m 안 (예 "1등급 비탈 35m")
        - medical: { id, name, kind, address, phone, er_phone, emergency_class, er } — er = { beds, ambulance, observed_at, stale } 응급실 가용병상
          (국립중앙의료원, 10분 수집, 40분 지나면 stale). 구룡포 안에 응급의료기관이 없어 bbox 생략 시 포항 전체
        - manholes: { id, kind(smart = 포항 DT 스마트맨홀), name, source }
        - landslide_zones: { name, hazard, grade, kind, reason, area_m2, shelter_distance_m }
          — kind = riskmap (산림청 산사태위험지도 1·2등급, 지도 표시용) | designated (지정 산사태 취약지역, reason = 지정사유)
          — 판정용 100m 범위(riskmap_g1_buf100 등)는 이 레이어에 나오지 않고, 판정되면 risk_areas 로 보임
        - risk_areas: /risk/areas 와 같음
        위험지역 고정 영역은 산사태만 (침수·해안 고정 영역 없음 — 침수는 실시간 판정 영역 risk_areas)
        flood_grid: 현재 침수 위험 판정 영역을 격자로 나눈 GeoJSON. 판정 영역 밖은 응답하지 않으며 관측을 미확인 셀까지 확장하지 않음.
      operationId: getLayer
      security: []
      parameters:
        - { name: layer_id, in: path, required: true, schema: { $ref: '#/components/schemas/LayerId' } }
        - $ref: '#/components/parameters/Bbox'
      responses:
        '200':
          description: GeoJSON FeatureCollection  (mock/layer.shelters.geojson, mock/layer.stations.geojson)
          content:
            application/geo+json:
              schema: { $ref: '#/components/schemas/FeatureCollection' }
        '404': { $ref: '#/components/responses/Error' }

  /hotlines:
    get:
      tags: [dashboard]
      summary: 긴급 전화 목록 (119·포항시 재난안전상황실·구룡포읍 등, 실데이터)
      description: 재난 종류를 주면 그 재난용 번호와 전 재난 공통 번호를 priority 순으로 반환
      operationId: getHotlines
      security: []
      parameters:
        - { name: hazard, in: query, schema: { $ref: '#/components/schemas/Hazard' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Hotline' }
  /support-programs:
    get:
      tags: [dashboard]
      summary: 재난 복구·지원 제도 (보험·복구·법률·어업·생계, 실데이터 support_programs) — 복구 화면 (2026-10-05)
      operationId: getSupportPrograms
      security: []
      parameters:
        - { name: hazard, in: query, schema: { $ref: '#/components/schemas/Hazard' } }
      responses:
        '200':
          description: 재난을 주면 그 재난용과 공통 제도
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, category, name, summary]
                  properties:
                    id: { type: integer }
                    category: { type: string }
                    hazards: { type: array, items: { type: string } }
                    targets: { type: array, items: { type: string } }
                    name: { type: string }
                    summary: { type: string }
                    eligibility: { type: [string, 'null'] }
                    how_to_apply: { type: [string, 'null'] }
                    apply_period: { type: [string, 'null'] }
                    department: { type: [string, 'null'] }
                    contact: { type: [string, 'null'] }
                    url: { type: [string, 'null'] }
                    updated_at: { type: [string, 'null'], format: date-time }

  # ================================================================ risk
  /risk:
    get:
      tags: [risk]
      summary: 한 지점의 재난별 현재 위험도
      operationId: getRisk
      security: []
      description: |
        현재 유효한 위험 영역(risk_assessments) 중 이 좌표를 포함하는 것을 재난별 최고 단계로 반환 (A3: 침수·포항 DT 강우).
        radius_m 를 주면 그 거리 안의 영역까지 포함하고 각 항목에 distance_m 을 붙인다.
        data_stale=true 면 판정이 30분 넘게 갱신되지 않은 것 → 앱은 '정상' 대신 '정보 지연'으로 표시.
      parameters:
        - $ref: '#/components/parameters/Lat'
        - $ref: '#/components/parameters/Lng'
        - { name: radius_m, in: query, schema: { type: number, minimum: 0, maximum: 5000, default: 0 } }
      responses:
        '200':
          description: OK  (mock/risk.json)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PointRisk' }
  /risk/areas:
    get:
      tags: [risk]
      summary: 현재 유효한 위험 영역 (지도 오버레이). Feature.properties 는 RiskItem
      operationId: getRiskAreas
      security: []
      parameters:
        - { name: hazard, in: query, schema: { $ref: '#/components/schemas/Hazard' } }
        - { name: min_level, in: query, schema: { $ref: '#/components/schemas/RiskLevel' }, description: '기본 watch' }
        - $ref: '#/components/parameters/Bbox'
      responses:
        '200':
          description: OK  (mock/risk-areas.geojson) — geometry 는 MultiPolygon (관측소 반경 원)
          content:
            application/geo+json:
              schema: { $ref: '#/components/schemas/FeatureCollection' }
  /risk/rules:
    get:
      tags: [risk]
      summary: 위험 판단 기준표 (출처 포함 — 앱의 '판단 근거' 화면, 환각 검증 agent 가 사용)
      operationId: getRiskRules
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RiskRule' }

  # ================================================================ alerts
  /alerts:
    get:
      tags: [alerts]
      summary: 새 경고 폴링 (+ 현재 위치 보고)
      description: |
        앱이 포그라운드일 때 `next_poll_sec` 간격으로 호출한다.
        lat/lng 를 함께 보내면 서버가 기기의 마지막 위치를 갱신하고 그 위치로 즉시 위험 판정을 한다.
        `since` 이후 생성되거나 상태가 바뀐 경고를 반환한다 (첫 호출은 생략 → 최근 24시간).
        같은 경고가 FCM 으로도 오므로, 앱은 `id` 로 중복을 제거한다.
        `evacuation` = 지금 진행 중인 대피 상황에서 내 대피 확인 상태 (없으면 null) — 대시보드 상단 카드.
      operationId: pollAlerts
      parameters:
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: device_id, in: query, schema: { type: string, format: uuid } }
        - { name: lat, in: query, schema: { type: number } }
        - { name: lng, in: query, schema: { type: number } }
      responses:
        '200':
          description: OK  (mock/alerts.json)
          content:
            application/json:
              schema:
                type: object
                required: [alerts, weather_bulletins, server_time, next_poll_sec]
                properties:
                  alerts:
                    type: array
                    items: { $ref: '#/components/schemas/Alert' }
                  weather_bulletins:
                    type: array
                    description: 화면 검토용 예시 특보·예보. 실제 발표 자료가 아니며 각 항목의 is_example을 확인한다.
                    items: { $ref: '#/components/schemas/WeatherBulletin' }
                  mode: { type: string, enum: [normal, emergency] }
                  evacuation: { oneOf: [ { $ref: '#/components/schemas/MyEvacuation' }, { type: 'null' } ] }
                  server_time: { type: string, format: date-time, description: '다음 폴링의 since 로 사용' }
                  next_poll_sec: { type: integer, examples: [60, 15] }
  /alerts/{alert_id}/read:
    post:
      tags: [alerts]
      summary: 경고 읽음 처리
      operationId: readAlert
      parameters:
        - { name: alert_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: OK }
  /alerts/{alert_id}/response:
    post:
      tags: [alerts]
      summary: 대피 확인 응답 — 대피 완료 / 대피 중 / 도움 필요 (알림 버튼·대시보드·음성 공통)
      description: |
        `response_required=true` 인 경고에만 쓸 수 있다. 같은 경고에 여러 번 보내면 마지막 상태로 바뀌고 이력이 남는다.
        - `need_help` 이면 서버가 즉시 방재단에게 FCM(`kind=escalation`)을 보낸다. `location` 을 꼭 함께 보낸다.
        - `evacuating` 이면 `recheck_after_min` 뒤 다시 확인 알림(`kind=reminder`)이 온다.
        - 음성(B12): 앱이 ai 서비스의 음성 분류 결과를 받아 `via=voice` 로 이 API 를 호출한다 (서버 간 호출 없음).
        대피 상황이 이미 종료됐으면 409 CONFLICT.
      operationId: respondAlert
      parameters:
        - { name: alert_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvacuationResponseInput' }
      responses:
        '200':
          description: 기록됨  (mock/alert-response.json)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvacuationResponseResult' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  # ================================================================ admin (방재단·생활지원사)
  /admin/overview:
    get:
      tags: [admin]
      summary: 전체 요약 — 등록 가구 수, 사정별 수, 진행 중인 대피 상황과 상태별 수
      description: 방재단 메인 페이지 맨 위. caregiver 는 담당 가구만 센다.
      operationId: adminOverview
      responses:
        '200':
          description: OK  (mock/admin.overview.json)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminOverview' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/incidents:
    get:
      tags: [admin]
      summary: 대피 상황 목록 (기본 진행 중)
      operationId: listIncidents
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [active, closed, all], default: active } }
      responses:
        '200':
          description: OK  (mock/admin.incidents.json)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Incident' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [admin]
      summary: 대피 상황 수동 시작 (판정 엔진이 못 잡은 상황 — 예 읍 대피 명령)
      description: |
        보통은 판정 엔진이 위험 영역(주의 이상)을 만들면 자동으로 생긴다 (source=auto).
        수동 시작 시 영역 안 등록 가구와 영역 안 앱 사용자에게 대피 확인 경고(response_required)가 나간다.
      operationId: createIncident
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncidentInput' }
      responses:
        '201':
          description: 생성됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentDetail' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /admin/incidents/{incident_id}:
    parameters:
      - { name: incident_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [admin]
      summary: 대피 현황 — 상태별 수 + 대상 목록(방문 우선순위 순) · 10초 폴링
      description: |
        범위(2026-10-03 확정): **위험 영역 안 대상만** 목록으로, 전체 수는 `summary` 와 `/admin/overview` 로.
        정렬: `priority_rank` 오름차순. B13 점수가 없으면 기본 순서 — 도움 필요 > 미응답 > 대피 중 > 대피 완료,
        같은 상태 안에서는 사정(needs) 개수가 많은 순.
      operationId: getIncident
      responses:
        '200':
          description: OK  (mock/admin.incident.json)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentDetail' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /admin/incidents/{incident_id}/map:
    get:
      tags: [admin]
      summary: 대피 현황 지도 — 상황 영역(Polygon) + 대상 점(Point)
      description: |
        Feature.properties.kind = `area` | `target`.
        target 의 properties = { target_id, label, status, priority_rank, needs, assigned_to_me }.
        대피소·위험 영역은 `/dashboard/layers/*` 를 같이 쓴다.
      operationId: getIncidentMap
      parameters:
        - { name: incident_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: OK  (mock/admin.incident-map.geojson)
          content:
            application/geo+json:
              schema: { $ref: '#/components/schemas/FeatureCollection' }
        '403': { $ref: '#/components/responses/Error' }

  /admin/incidents/{incident_id}/targets/{target_id}:
    patch:
      tags: [admin]
      summary: 방재단이 대상 상태 대신 기록 · 방문 담당 지정 (스마트폰 없는 가구 등)
      operationId: updateTarget
      parameters:
        - { name: incident_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: target_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TargetPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentTarget' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/incidents/{incident_id}/targets/{target_id}/visits:
    post:
      tags: [admin]
      summary: 방문 기록 (A14) — 결과와 방문 후 상태
      description: |
        등록 가구와 가구 등록 없는 앱 사용자 모두 (2026-10-04 — 앱으로 도움 요청한 사람도 방문 기록).
        방문 후 상태: status_after 를 보내면 그 값, 생략하면 함께 대피·이송·이미 대피 → evacuated,
        부재·거부·기타 → 상태를 바꾸지 않음 (기록만 — 대상의 last_visit 로 보임). 대피 상황이 종료됐으면 409.
      operationId: addVisit
      parameters:
        - { name: incident_id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: target_id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisitInput' }
      responses:
        '201':
          description: 기록됨  (mock/admin.visit.json)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VisitLog' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /admin/incidents/{incident_id}/close:
    post:
      tags: [admin]
      summary: 대피 상황 종료 (admin·responder) — 대상자에게 kind=incident_closed 푸시
      operationId: closeIncident
      parameters:
        - { name: incident_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: 종료됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Incident' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /admin/households:
    get:
      tags: [admin]
      summary: 취약 가구 목록 (caregiver 는 담당 가구만)
      operationId: listHouseholds
      parameters:
        - { name: q, in: query, description: '표시명·주소 검색', schema: { type: string } }
        - { name: needs, in: query, description: '쉼표 구분, 모두 포함하는 가구만 (예 living_alone,mobility_limited)', schema: { type: string } }
        - $ref: '#/components/parameters/Bbox'
      responses:
        '200':
          description: OK  (mock/admin.households.json)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Household' }
        '403': { $ref: '#/components/responses/Error' }
    post:
      tags: [admin]
      summary: 취약 가구 대리 등록 (방재단·생활지원사, 동의 방법 기록 필수)
      operationId: createHousehold
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HouseholdInput' }
      responses:
        '201':
          description: 등록됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Household' }
        '403': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }

  /admin/households/{household_id}:
    parameters:
      - { name: household_id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [admin]
      summary: 가구 상세 + 최근 방문 기록
      operationId: getHousehold
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Household'
                  - type: object
                    properties:
                      recent_visits:
                        type: array
                        items: { $ref: '#/components/schemas/VisitLog' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [admin]
      summary: 가구 정보 수정
      operationId: updateHousehold
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HouseholdPatch' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Household' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [admin]
      summary: 가구 삭제 (동의 철회 등) — 그 가구의 대피 응답·방문 기록도 삭제
      operationId: deleteHousehold
      responses:
        '204': { description: 삭제됨 }
        '403': { $ref: '#/components/responses/Error' }

  # ================================================================ internal
  /internal/simulate:
    post:
      tags: [internal]
      summary: 재난 시나리오 주입 (시연용) — 가상 관측값·특보를 넣고 risk engine 재계산, 대상자에게 FCM 발송
      operationId: simulate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenario]
              properties:
                scenario: { type: string, enum: [heavy_rain_flood, clear, demo_households, demo_households_clear] }
      description: |
        모의 관측값(observations.quality='simulated')을 넣고 즉시 판정. 모의값은 6시간 동안 실측보다 우선하고 clear 로 지운다.
        구현된 시나리오: heavy_rain_flood, clear. 새 시나리오를 만들면 이 목록에 추가한다.
        demo_households (A13): 시연용 가상 취약 가구 5곳 등록(표시명 "[시연] …", 실제 개인정보 아님, 다시 실행하면 교체) —
        침수 경보 영역 2곳·산사태위험지도 1등급 비탈 1곳 포함. demo_households_clear 로 삭제 (clear 는 가구를 지우지 않음).
        A12 이후: 위험 영역이 생기면 대피 상황(source=simulated)과 대피 확인 경고도 함께 만들어진다.
      responses:
        '202': { description: '적용됨 — 응답 필드 scenario, accepted, observations, assessments, risk_run' }
  /internal/ingest:
    get:
      tags: [internal]
      summary: 수집 작업 목록과 각 작업의 최근 실행 결과
      operationId: listIngest
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    source: { type: string }
                    job: { type: string }
                    cron: { type: string }
                    stale_after_min: { type: integer }
                    last_run:
                      oneOf:
                        - type: 'null'
                        - type: object
                          properties:
                            id: { type: integer }
                            status: { type: string, enum: [running, success, failed] }
                            started_at: { type: string, format: date-time }
                            finished_at: { type: [string, 'null'], format: date-time }
                            row_count: { type: [integer, 'null'] }
                            error: { type: [string, 'null'] }
  /internal/invites:
    post:
      tags: [internal]
      summary: 초대 코드 발급 (읍사무소·운영자) — 코드 원문은 이 응답에서 한 번만 보인다
      operationId: createInvite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { type: string, enum: [responder, caregiver, admin] }
                label: { type: string, examples: ['구룡포읍 자율방재단 2026'] }
                max_uses: { type: [integer, 'null'], minimum: 1 }
                expires_in_days: { type: integer, minimum: 1, maximum: 365, default: 60 }
      responses:
        '201':
          description: 발급됨
          content:
            application/json:
              schema:
                type: object
                required: [code, role]
                properties:
                  code: { type: string, examples: ['GRY-7K4M-2QX9'] }
                  role: { type: string }
                  label: { type: [string, 'null'] }
                  max_uses: { type: [integer, 'null'] }
                  expires_at: { type: string, format: date-time }

  /internal/ingest/{source}/{job}:
    post:
      tags: [internal]
      summary: 수집 작업 수동 실행
      operationId: runIngest
      parameters:
        - { name: source, in: path, required: true, schema: { type: string } }
        - { name: job, in: path, required: true, schema: { type: string } }
      responses:
        '202':
          description: 실행 시작
          content:
            application/json:
              schema:
                type: object
                properties:
                  ingest_run_id: { type: integer }

  # ================================================================ ai 서비스 (B) — servers 가 다름
  /api/chat:
    servers:
      - { url: 'http://localhost:8001', description: 'ai 로컬. 배포는 https://<도메인> (Caddy 가 /api/chat 을 ai 로)' }
    post:
      tags: [ai]
      summary: AI 대화 (LangGraph) — 원본 ai/guardian_ai/service.py ChatRequest·ChatResponse
      description: |
        응답 시간 7~19초, 검증 재시도 시 30초 이상 (2026-10-03 실측, 목표 15초) → 앱은 대기 표시.
        인증: 아직 없음 (Firebase 토큰 검증은 B 가 A 방식에 맞춰 추가 예정 — user_id 는 기기별 ID).
        답에 경로가 있으면 `route` 를 주고, 앱은 "지도에서 경로 보기"로 그린다 (`geometry` = 인코딩 polyline).
      operationId: aiChat
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiChatRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiChatResponse' }

  /api/voice:
    servers:
      - { url: 'http://localhost:8001', description: 'ai 로컬. 배포는 Caddy 가 /api/voice 를 ai 로' }
    post:
      tags: [ai]
      summary: 음성 질문 → 받아쓰기(Google STT) → /api/chat 과 같은 대화 → 답 음성(Google TTS, mp3) — 원본 ai/guardian_ai/api.py
      description: |
        녹음 형식은 무엇이든 된다(서버가 ffmpeg 로 16kHz mono 로 바꿈). 앱은 16kHz mono WAV 를 보낸다. 30초·5MB 이내.
        응답 = AiChatResponse + `transcript`(받아쓴 질문) + `audio_b64`(답의 voice_text 를 읽은 mp3, 합성 실패면 null).
        대화는 conversation_id 로 /api/chat 과 이어진다.
      operationId: aiVoice
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio, user_id]
              properties:
                audio: { type: string, format: binary, description: '녹음 파일 (wav·webm·m4a 등)' }
                user_id: { type: string }
                conversation_id: { type: string }
                lat: { type: number }
                lon: { type: number }
                profile: { type: string, description: 'AiUserProfile JSON 문자열' }
                remember: { type: boolean, default: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/AiChatResponse' }
                  - type: object
                    required: [transcript]
                    properties:
                      transcript: { type: string }
                      audio_b64: { type: [string, 'null'], description: 'mp3 base64' }
        '422': { description: '말을 알아듣지 못함·녹음이 너무 김·읽을 수 없는 파일 (detail 문구를 그대로 보여 줌)' }
        '503': { description: '음성 기능 준비 안 됨 (서버에 Google 키 없음) 또는 Google 연결 실패' }

  /api/tts:
    servers:
      - { url: 'http://localhost:8001', description: 'ai 로컬. 배포는 Caddy 가 /api/tts 를 ai 로' }
    post:
      tags: [ai]
      summary: 문장 → 음성(mp3). 앱 "음성으로 듣기"·경고 읽기. 같은 문장은 10분 동안 캐시
      operationId: aiTts
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, description: '보통 AiChatResponse.voice_text' }
      responses:
        '200':
          description: mp3
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
        '422': { description: 빈 문장 }
        '503': { description: 음성 기능 준비 안 됨 }

  # ================================================================ route 서비스 (B) — servers 가 다름
  /api/route:
    servers:
      - { url: 'http://localhost:8002', description: 'route 로컬. 배포는 https://<도메인>' }
    post:
      tags: [route]
      summary: 안전 대피 경로 — 원본 route/guardian_route/service.py RouteRequest·RouteResponse
      description: |
        판정 엔진의 위험 영역(주의 이상, api `/risk/areas`)을 피한다. 피할 수 없으면 `still_inside` 에 남긴다.
        `hazards_ok=false` 면 위험 영역을 못 읽어 회피 없이 계산한 경로 → 앱은 경고 문구 표시.
        경로 엔진 장애 503, 도로망 범위 밖 404.
      operationId: route
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouteRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteResponse' }
  /api/route/check:
    servers:
      - { url: 'http://localhost:8002' }
    post:
      tags: [route]
      summary: 이동 중 재검사 (약 30초마다) — 30m 이탈·남은 경로의 새 위험 → 재계산, 20m 안 도착
      operationId: routeCheck
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouteCheckRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RouteCheckResponse' }
  /api/route/sea:
    servers:
      - { url: 'http://localhost:8002' }
    post:
      tags: [route]
      summary: '[B11 1차] 해상 → 최근접 항 → 대피소 경로'
      description: |
        **B11 1차 구현 (2026-10-05, route/guardian_route/sea.py)** — 응답 형식은 고정, 판정 세부(항로 막힘 기준 등)는 B11 마무리 때 바뀔 수 있다.
        해상 구간은 도로가 없으므로 직선 거리·방위로 안내하고, 항구의 육상 연결 지점(`land_point`)부터는 `/api/route` 와 같은 계산을 한다.
        출발 좌표가 육지(OSM 해안선 기준, 물가 30m 포함)면 `at_sea=false` 와 함께 일반 경로만 돌려준다. 구룡포 일대 밖이면 422.
        항구: `route/data/ports.geojson` 12곳 (같은 내용이 DB `ports`, `db/init/10_seed_ports.sql`). 풍랑 특보는 이 응답에 없다 —
        앱은 대시보드 warnings(hazard=high_seas), AI 는 get_weather_warnings 로 붙인다.
        GraphHopper 장애·경로 없음이면 해상 안내는 그대로 주고 `land_route=null`, `land_route_error` 에 이유.
      operationId: routeSea
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SeaRouteRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SeaRouteResponse' }

# ======================================================================
components:
  securitySchemes:
    firebaseAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token (JWT)
      description: FirebaseAuth.instance.signInAnonymously() 후 currentUser.getIdToken()

  parameters:
    Lat:
      name: lat
      in: query
      required: true
      schema: { type: number, minimum: -90, maximum: 90, examples: [35.9889] }
    Lng:
      name: lng
      in: query
      required: true
      schema: { type: number, minimum: -180, maximum: 180, examples: [129.5556] }
    Bbox:
      name: bbox
      in: query
      description: 'minLng,minLat,maxLng,maxLat (생략 시 구룡포 전체)'
      schema: { type: string, examples: ['129.53,35.97,129.58,36.01'] }

  responses:
    Error:
      description: 오류
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    # ------------------------------------------------------------ 공통
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [UNAUTHORIZED, FORBIDDEN, NOT_FOUND, CONFLICT, INVALID_INVITE, VALIDATION_ERROR, STT_FAILED, AGENT_TIMEOUT, UPSTREAM_UNAVAILABLE, INTERNAL]
          description: |
            401 UNAUTHORIZED / 403 FORBIDDEN 역할 없음 / 404 NOT_FOUND / 409 CONFLICT 이미 종료된 대피 상황 등 /
            400 INVALID_INVITE 초대 코드 틀림·만료 / 422 VALIDATION_ERROR, STT_FAILED / 504 AGENT_TIMEOUT / 503 UPSTREAM_UNAVAILABLE / 500 INTERNAL
        message: { type: string, description: 사용자에게 그대로 보여줘도 되는 한국어 문장 }
        detail: {}
    LatLng:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number }
        lng: { type: number }
    Platform: { type: string, enum: [ios, android, web] }
    Health:
      type: object
      required: [status, components]
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        version: { type: string }
        components:
          type: object
          additionalProperties:
            type: object
            properties:
              status: { type: string, enum: [ok, degraded, down] }
              last_success_at: { type: [string, 'null'], format: date-time }

    # ------------------------------------------------------------ 위험도 표기 규약
    Hazard:
      type: string
      enum: [landslide, heavy_rain, flood, strong_wind, typhoon, high_seas, fine_dust, ultrafine_dust, uv]
      description: |
        landslide 산사태 / heavy_rain 호우 / flood 침수 / strong_wind 강풍 / typhoon 태풍 /
        high_seas 풍랑 / fine_dust 미세먼지 / ultrafine_dust 초미세먼지 / uv 자외선
    RiskLevel:
      type: string
      enum: [normal, watch, advisory, warning, critical]
      description: |
        level_num 0 normal 정상 / 1 watch 관심 / 2 advisory 주의보 / 3 warning 경보 / 4 critical 심각.
        자외선은 0~4 = 낮음·보통·높음·매우높음·위험
    RiskItem:
      type: object
      description: 모든 API 에서 위험도를 표기하는 단일 형식
      required: [hazard, level, level_num, label]
      properties:
        hazard: { $ref: '#/components/schemas/Hazard' }
        level: { $ref: '#/components/schemas/RiskLevel' }
        level_num: { type: integer, minimum: 0, maximum: 4, description: 정렬·색상용 }
        label: { type: string, description: '화면 표기용 한국어. 예) 호우경보, 자외선 매우높음' }
        reason: { type: [string, 'null'], description: '판단 근거 한 줄. 예) 3시간 누적강수 92mm (구룡포 AWS, 14:30)' }
        location: { $ref: '#/components/schemas/LatLng' }
        area_id: { type: [integer, 'null'], description: risk_assessments.id — /risk/areas 의 Feature id 와 같음 }
        rule_id: { type: [integer, 'null'] }
        observed_at: { type: [string, 'null'], format: date-time }
        location_note: { type: string, description: 'location = 위험의 원인 지점(관측소). 조회 좌표가 아님' }
        distance_m: { type: integer, description: '/risk?radius_m 사용 시 조회 좌표에서 영역까지 거리 (영역 안이면 0)' }
        simulated: { type: boolean, description: '시연용 모의값으로 판정됨 (/internal/simulate)' }
    PointRisk:
      type: object
      required: [location, max_level, max_level_num, items, computed_at]
      properties:
        location: { $ref: '#/components/schemas/LatLng' }
        max_level: { $ref: '#/components/schemas/RiskLevel' }
        max_level_num: { type: integer }
        items:
          type: array
          description: level_num 내림차순. normal 인 재난은 제외
          items: { $ref: '#/components/schemas/RiskItem' }
        computed_at: { type: string, format: date-time, description: 판정 엔진 마지막 실행 시각 }
        data_stale: { type: boolean, description: 판정이 30분 넘게 갱신되지 않음 }
    RiskRule:
      type: object
      properties:
        id: { type: integer }
        hazard: { $ref: '#/components/schemas/Hazard' }
        level: { $ref: '#/components/schemas/RiskLevel' }
        label: { type: string }
        metric: { type: [string, 'null'] }
        operator: { type: [string, 'null'] }
        threshold: { type: [number, 'null'] }
        threshold_max: { type: [number, 'null'] }
        duration_min: { type: [integer, 'null'] }
        condition: { type: object }
        source_name: { type: string }
        source_url: { type: [string, 'null'] }

    # ------------------------------------------------------------ user
    ProfileInput:
      type: object
      description: 선택 프로필 항목. 사용자는 출생연도·이동수단과 등록 장소를 제공할 수 있습니다.
      properties:
        nickname: { type: string }
        birth_year: { type: integer, minimum: 1900, maximum: 2100 }
        mobility: { type: string, enum: [walk, car, bicycle, public_transit, wheelchair] }
        occupation: { type: [string, 'null'], examples: [fisher, merchant, farmer, office, student] }
        owns_vessel: { type: boolean }
        walking_ability: { type: string, enum: [normal, limited, unable] }
        vision_impaired: { type: boolean }
        hearing_impaired: { type: boolean }
        blood_type: { type: [string, 'null'], enum: ['A+', 'A-', 'B+', 'B-', 'O+', 'O-', 'AB+', 'AB-', null] }
        has_dependents: { type: boolean }
        dependents_note: { type: [string, 'null'] }
        medical_note: { type: [string, 'null'] }
        prefers_voice: { type: boolean }
        alert_prefs: { $ref: '#/components/schemas/AlertPrefs' }
    User:
      type: object
      required: [id, firebase_uid, is_anonymous, role, profile, places, contacts, onboarding]
      properties:
        id: { type: string, format: uuid }
        firebase_uid: { type: string }
        is_anonymous: { type: boolean }
        role: { $ref: '#/components/schemas/Role' }
        household:
          description: 본인이 등록한 취약 가구 (없으면 null) — 상세는 GET /user/household
          oneOf:
            - type: 'null'
            - type: object
              required: [id, needs]
              properties:
                id: { type: string, format: uuid }
                needs: { type: array, items: { $ref: '#/components/schemas/HouseholdNeed' } }
        profile: { $ref: '#/components/schemas/ProfileInput' }
        places:
          type: array
          items: { $ref: '#/components/schemas/Place' }
        contacts:
          type: array
          items: { $ref: '#/components/schemas/EmergencyContact' }
        onboarding:
          type: object
          required: [completed, missing]
          properties:
            completed: { type: boolean }
            missing:
              type: array
              items: { type: string, enum: [birth_year, mobility, home_place] }
              description: 'home_place = 집 또는 숙소(lodging) 장소가 없음 — 숙소를 등록한 관광객은 집을 요구하지 않는다'
        created_at: { type: string, format: date-time }
    PlaceInput:
      type: object
      description: |
        도로명 주소(address)·좌표(location) 중 하나 이상 (2026-10-04). location 이 있으면 그 좌표를 그대로 쓰고 address 는 받은 글자 그대로 저장,
        address 만 있으면 서버가 카카오로 도로명 주소·좌표 변환 (서버에 KAKAO_REST_KEY 필요, 도로명 결과가 없으면 404).
        지번만 있는 집·항구, 지도에서 찍기·현재 위치(GPS)로 등록할 때는 location 을 보낸다.
      required: [place_type, label]
      anyOf:
        - required: [address]
        - required: [location]
      properties:
        place_type: { type: string, enum: [home, work, frequent, lodging], description: 'lodging(숙소)만 있고 home 이 없으면 관광객으로 본다 (집 등록 요구 안 함)' }
        label: { type: string }
        address: { type: [string, 'null'], minLength: 1, maxLength: 300 }
        location: { $ref: '#/components/schemas/LatLng' }
        notify: { type: boolean, default: true }
    PlacePatch:
      type: object
      description: 보낸 필드만 변경. location 을 보내면 그 좌표로, address 만 보내면 카카오 변환 좌표로 위치도 바뀐다
      properties:
        place_type: { type: string, enum: [home, work, frequent, lodging] }
        label: { type: string }
        address: { type: string, minLength: 1, maxLength: 300 }
        location: { $ref: '#/components/schemas/LatLng' }
        notify: { type: boolean }
    Place:
      allOf:
        - $ref: '#/components/schemas/PlaceInput'
        - type: object
          required: [id, location]
          properties:
            id: { type: string, format: uuid }
            location: { $ref: '#/components/schemas/LatLng' }
            in_hazard_zones:
              type: array
              description: 이 장소가 포함된 정적 위험지역 (지금은 산사태만 — 위험지도 1·2등급 100m·지정 취약지역)
              items: { $ref: '#/components/schemas/Hazard' }
    EmergencyContact:
      type: object
      required: [name, phone]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string }
        relation: { type: [string, 'null'] }
        phone: { type: string }
        priority: { type: integer, default: 1 }

    # ------------------------------------------------------------ dashboard
    LayerId:
      type: string
      enum: [shelters, medical, landslide_zones, manholes, stations, risk_areas, flood_grid]
    Dashboard:
      type: object
      required: [mode, point_risk, widgets, highlight_layers, updated_at]
      properties:
        mode: { type: string, enum: [normal, emergency] }
        headline:
          description: 최상단 배너. 위험이 없으면 null
          oneOf:
            - type: 'null'
            - type: object
              required: [risk, title, action]
              properties:
                risk: { $ref: '#/components/schemas/RiskItem' }
                title: { type: string }
                action: { type: string, enum: [open_route, open_chat, open_checklist, none] }
        point_risk: { $ref: '#/components/schemas/PointRisk' }
        places:
          type: array
          description: 등록 장소별 위험 요약
          items:
            type: object
            properties:
              place_id: { type: string, format: uuid }
              label: { type: string }
              max_level: { $ref: '#/components/schemas/RiskLevel' }
              max_level_num: { type: integer }
        widgets:
          type: array
          description: 표시 순서대로 정렬됨
          items: { $ref: '#/components/schemas/Widget' }
        highlight_layers:
          type: array
          items: { $ref: '#/components/schemas/LayerId' }
        nearest_shelters:
          type: array
          description: '현재 재난에 맞지 않는 대피소(unsuitable_for)는 뒤로, 위험 영역 안(in_risk_area)은 제외'
          items: { $ref: '#/components/schemas/Shelter' }
        evacuation:
          description: 진행 중인 대피 상황에서 내 대피 확인 상태 — 있으면 상단에 버튼 3개 카드 (대시보드에서도 상태 변경)
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/MyEvacuation'
        updated_at: { type: string, format: date-time }
    Widget:
      type: object
      required: [type, emphasized, data]
      properties:
        type:
          type: string
          enum: [warnings, rain, wind, water_level, wave, forecast, typhoon, disaster_messages, life_safety, checklist]
        emphasized: { type: boolean, description: true 면 빨간 테두리 등 강조 }
        data:
          type: object
          description: |
            type 별 내용 (2026-10-05 실데이터: 자료가 없으면 어느 type 이든 { available: false, reason } )
            - warnings: { items: [ { label, region_name, issued_at } ] }
            - rain / wind / wave: { station_name, value, unit, observed_at, level, series: [ { t, v } ] }
            - water_level: { observed_at, stations: [ { station_id, station_name, kind, metric, value, unit, source_level, source_level_label, level, location } ], series: { station_id, metric, points: [ { t, v } ] } }
              (포항 DT 센서. kind = manhole 스마트맨홀 / road_flood 지표면 수위계 / river_level 하천 수위계, value 단위 mm,
               source_level 1 정상 · 2 보통 · 3 주의 · 4 경보 · 5 위험 → level normal · watch · advisory · warning · critical,
               manhole 은 value=null (등급만 사용), observed_at 은 원천 측정 시각이 아닌 수집 시각 → 앱은 "14:27 수집" 으로 표기)
            - forecast: { slots: [ { t, pop, pty, pcp_mm, tmp, wsd } ] }
            - typhoon: { name_ko, distance_km, eta_closest, track: [ { t, lat, lng, is_forecast } ] }
            - disaster_messages: { items: [ { sent_at, sender, message } ] }
            - life_safety: { items: [ RiskItem + value, unit ] }
            - checklist: { hazard, items: [ { id, content, checked, is_often_missed } ] }
    Shelter:
      type: object
      required: [id, name, location]
      properties:
        id: { type: integer }
        name: { type: string }
        shelter_types: { type: array, items: { type: string } }
        address: { type: [string, 'null'] }
        capacity: { type: [integer, 'null'] }
        is_accessible: { type: [boolean, 'null'] }
        location: { $ref: '#/components/schemas/LatLng' }
        distance_m: { type: number, description: 요청 좌표 기준 직선거리 }
        in_risk_area: { type: boolean, description: 대피소 자체가 현재 위험 영역 안이면 true (안내 대상에서 제외됨) }
        unsuitable_for: { type: array, items: { $ref: '#/components/schemas/Hazard' }, description: '이 재난 때는 권하지 않음 (지금은 landslide 만)' }
        unsuitable_reason: { type: [string, 'null'], examples: ['산사태위험지도 1등급 비탈 35m'] }
    FeatureCollection:
      type: object
      required: [type, features]
      properties:
        type: { const: FeatureCollection }
        features:
          type: array
          items:
            type: object
            required: [type, geometry, properties]
            properties:
              type: { const: Feature }
              id: { type: [integer, string] }
              geometry:
                type: object
                required: [type, coordinates]
                properties:
                  type: { type: string, enum: [Point, LineString, Polygon, MultiPolygon] }
                  coordinates: { type: array }
              properties: { type: object }

    # ------------------------------------------------------------ alerts / FCM
    Alert:
      type: object
      required: [id, risk, title, body, created_at]
      properties:
        id: { type: string, format: uuid }
        risk: { $ref: '#/components/schemas/RiskItem' }
        title: { type: string }
        body: { type: string }
        reason:
          type: object
          description: 이 사용자에게 보낸 이유
          properties:
            trigger: { type: string, enum: [current_location, place, profile, broadcast] }
            place_label: { type: [string, 'null'] }
            profile_tags: { type: array, items: { type: string } }
        actions:
          type: array
          items:
            type: object
            required: [type, label]
            properties:
              type: { type: string, enum: [open_route, open_chat, open_checklist, call, respond] }
              label: { type: string }
              params: { type: object }
        response_required: { type: boolean, description: 'true 면 대피 확인 버튼 3개 (POST /alerts/{id}/response)' }
        incident_id: { type: [string, 'null'], format: uuid }
        my_status: { oneOf: [ { $ref: '#/components/schemas/EvacStatus' }, { type: 'null' } ], description: '내가 마지막으로 보낸 대피 상태' }
        tts_text: { type: [string, 'null'], description: '음성으로 읽어 줄 짧은 문장 (접근성 tts·음성 대피 확인)' }
        created_at: { type: string, format: date-time }
        read_at: { type: [string, 'null'], format: date-time }
    WeatherBulletin:
      type: object
      required: [id, kind, region_name, published_at, valid_from, valid_to, content, source, is_example, data_label]
      properties:
        id: { type: string }
        kind: { type: string, enum: [warning, forecast] }
        region_name: { type: string, description: 대상 행정구역 }
        published_at: { type: string, format: date-time }
        valid_from: { type: string, format: date-time }
        valid_to: { type: string, format: date-time }
        level: { type: [string, 'null'], description: 특보 단계. 예보 항목은 null일 수 있음 }
        content: { type: string, description: 특보 내용 또는 예보 요약 }
        source: { type: string }
        source_url: { type: string, format: uri }
        is_example: { type: boolean, description: true이면 실제 발표/관측 자료가 아님 }
        data_label: { type: string }
    FcmPayload:
      type: object
      description: |
        FCM 메시지 형식 (API 응답이 아니라 푸시 규약). notification 에 title/body, data 에 아래 필드가 모두 **문자열**로 들어간다.
        앱은 알림을 누르면 kind 에 맞는 API 로 전체 내용을 다시 받는다 (주민 GET /alerts, 방재단 GET /admin/incidents/{id}).
        kind
        - alert: 일반 선제 경고
        - evacuation: 대피 확인 경고 — 알림에 버튼 3개(대피 완료·대피 중·도움 필요)를 붙이고 누르면 POST /alerts/{alert_id}/response (via=button)
        - reminder: 미응답 재알림 / 대피 중 재확인 (같은 alert_id)
        - escalation: 방재단·담당 생활지원사에게 — 도움 요청·장시간 미응답 대상 (incident_id, target_id)
        - incident_closed: 대피 상황 종료
        접근성(C7): 앱이 사용자 alert_prefs 에 따라 tts_text 읽기·강한 진동·화면 깜빡임을 한다.
      required: [kind]
      properties:
        kind: { type: string, enum: [alert, evacuation, reminder, escalation, incident_closed] }
        alert_id: { type: string }
        incident_id: { type: string }
        target_id: { type: string, description: escalation 만 }
        hazard: { type: string }
        level: { type: string }
        level_num: { type: string, examples: ['3'] }
        action: { type: string, examples: [open_route, respond, open_incident] }
        tts_text: { type: string }

    # ------------------------------------------------------------ 긴급 전화
    Hotline:
      type: object
      required: [id, name, phone, scope]
      properties:
        id: { type: integer }
        name: { type: string, examples: ['포항시 재난안전상황실'] }
        phone: { type: string }
        scope: { type: string, enum: [national, pohang, guryongpo] }
        hazards: { type: array, items: { $ref: '#/components/schemas/Hazard' }, description: '비어 있으면 전 재난 공통' }
        targets: { type: array, items: { type: string } }
        priority: { type: integer, description: 낮을수록 먼저 }
        note: { type: [string, 'null'] }
        source_name: { type: string }

    # ------------------------------------------------------------ 역할 · 접근성
    Role:
      type: string
      enum: [resident, responder, caregiver, admin]
      description: resident 주민 / responder 자율방재단 / caregiver 생활지원사 / admin 읍 담당자
    RoleGrant:
      type: object
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/Role' }
        label: { type: [string, 'null'], description: '초대 코드 이름 (예 구룡포읍 자율방재단 2026)' }
        granted_at: { type: string, format: date-time }
    AlertPrefs:
      type: object
      description: |
        C7 접근성 알림. 저장값이 없으면 서버가 기본값을 채워 준다 —
        vision_impaired → tts, hearing_impaired → strong_vibration + screen_flash. large_text 는 기본 false.
      properties:
        tts: { type: boolean, description: '경고 수신 시 tts_text 를 자동으로 읽어 줌' }
        strong_vibration: { type: boolean, description: '긴 진동 패턴 (청각장애)' }
        screen_flash: { type: boolean, description: '화면·플래시 깜빡임 (청각장애)' }
        large_text: { type: boolean }

    # ------------------------------------------------------------ 대피 확인 (A5·A12)
    EvacStatus:
      type: string
      enum: [no_response, evacuating, evacuated, need_help]
      description: |
        버튼 문구 (2026-10-03 확정): evacuated **대피 완료** / evacuating **대피 중** / need_help **도움 필요**.
        no_response 는 아직 응답 없음 (초기값, 앱에서 보낼 수 없음)
    ResponseVia:
      type: string
      enum: [button, voice, dashboard, responder, auto]
      description: button 알림 버튼 / voice 음성 확인(B12) / dashboard 앱 대시보드 / responder 방재단이 대신 기록 / auto 시스템
    EvacuationResponseInput:
      type: object
      required: [status, via]
      properties:
        status: { type: string, enum: [evacuated, evacuating, need_help] }
        via: { type: string, enum: [button, voice, dashboard] }
        location: { $ref: '#/components/schemas/LatLng' }
        note: { type: string, maxLength: 200, description: '도움 필요 시 한 줄 (예 다리를 다쳐 못 움직여요)' }
        transcript: { type: string, maxLength: 500, description: 'via=voice 일 때 STT 결과 (기록용)' }
    EvacuationResponseResult:
      type: object
      required: [alert_id, incident_id, status, recorded_at]
      properties:
        alert_id: { type: string, format: uuid }
        incident_id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/EvacStatus' }
        recorded_at: { type: string, format: date-time }
        recheck_after_min: { type: [integer, 'null'], description: 'evacuating 이면 다시 확인할 때까지 분, 그 외 null' }
        message: { type: string, description: '앱에 그대로 보여 줄 문장 (예 방재단에 도움 요청을 전달했어요)' }
        call_suggested: { type: boolean, description: 'need_help 면 true — 앱은 119 버튼을 크게' }
    MyEvacuation:
      type: object
      description: 대시보드·경고에 붙는 '내 대피 확인' 상태
      required: [incident_id, alert_id, status]
      properties:
        incident_id: { type: string, format: uuid }
        alert_id: { type: string, format: uuid }
        hazard: { $ref: '#/components/schemas/Hazard' }
        level: { $ref: '#/components/schemas/RiskLevel' }
        title: { type: string }
        status: { $ref: '#/components/schemas/EvacStatus' }
        status_at: { type: [string, 'null'], format: date-time }
        started_at: { type: string, format: date-time }

    # ------------------------------------------------------------ 취약 가구 (A13)
    HouseholdNeed:
      type: string
      enum: [elderly, living_alone, mobility_limited, wheelchair, bedridden, hearing, vision, cognitive, medical_device, infant, pet]
      description: |
        elderly 65세 이상 / living_alone 독거 / mobility_limited 보행 불편 / wheelchair 휠체어 / bedridden 와상 /
        hearing 청각장애 / vision 시각장애 / cognitive 인지 저하 / medical_device 산소·투석 등 의료기기 / infant 영유아 / pet 반려동물
    Household:
      type: object
      required: [id, label, location, members, needs, source, consent]
      properties:
        id: { type: string, format: uuid }
        label: { type: string, description: '화면 표시명 (예 삼정리 김OO 어르신 댁)' }
        address: { type: [string, 'null'] }
        location: { $ref: '#/components/schemas/LatLng' }
        phone: { type: [string, 'null'] }
        members: { type: integer, minimum: 1 }
        needs: { type: array, items: { $ref: '#/components/schemas/HouseholdNeed' } }
        has_app: { type: boolean, description: '본인이 앱으로 등록 (대피 확인 경고를 직접 받음)' }
        caregiver: { oneOf: [ { type: 'null' }, { type: object, properties: { user_id: { type: string, format: uuid }, nickname: { type: [string, 'null'] } } } ] }
        source: { type: string, enum: [self, responder, caregiver] }
        consent:
          type: object
          required: [at, method, by]
          properties:
            at: { type: string, format: date-time }
            method: { type: string, enum: [app, written, verbal] }
            by: { type: string, description: '본인 / 보호자 김OO 등' }
            version: { type: string, examples: [v1], description: '동의서 버전 (A13). 동의 문구가 바뀌면 올라가고, 이전 버전 가구는 재동의 대상' }
        landslide_zone: { type: [string, 'null'], description: '산사태 취약지역·위험지도 1·2등급 100m 안이면 그 이름 (우선순위 근거)' }
        note: { type: [string, 'null'], description: '방문 참고 (출입 방법 등). 진단명 등 의료정보는 적지 않는다' }
        active: { type: boolean, description: 'false 면 목록·대피 대상에서 빠짐 (PATCH active)' }
        updated_at: { type: string, format: date-time }
    SelfHouseholdInput:
      type: object
      required: [location, members, needs, consent]
      properties:
        label: { type: string, description: '생략 시 닉네임 + 댁' }
        address: { type: string }
        location: { $ref: '#/components/schemas/LatLng' }
        phone: { type: string }
        members: { type: integer, minimum: 1, default: 1 }
        needs: { type: array, items: { $ref: '#/components/schemas/HouseholdNeed' } }
        note: { type: string, maxLength: 300 }
        consent: { const: true, description: '민감정보(사정·위치·연락처) 수집·방재단 제공 동의. true 가 아니면 422' }
    HouseholdInput:
      type: object
      required: [label, location, members, needs, consent_method, consent_by]
      properties:
        label: { type: string }
        address: { type: string }
        location: { $ref: '#/components/schemas/LatLng' }
        phone: { type: string }
        members: { type: integer, minimum: 1, default: 1 }
        needs: { type: array, items: { $ref: '#/components/schemas/HouseholdNeed' } }
        caregiver_user_id: { type: [string, 'null'], format: uuid, description: '생략 시 caregiver 가 등록하면 본인' }
        consent_method: { type: string, enum: [written, verbal], description: '대리 등록은 서면 또는 구두 동의 확인' }
        consent_by: { type: string, examples: ['본인', '보호자 김OO'] }
        note: { type: string, maxLength: 300 }
    HouseholdPatch:
      type: object
      description: 보낸 필드만 변경 (HouseholdInput 의 필드, 모두 선택)
      properties:
        label: { type: string }
        address: { type: string }
        location: { $ref: '#/components/schemas/LatLng' }
        phone: { type: [string, 'null'] }
        members: { type: integer, minimum: 1 }
        needs: { type: array, items: { $ref: '#/components/schemas/HouseholdNeed' } }
        caregiver_user_id: { type: [string, 'null'], format: uuid }
        note: { type: [string, 'null'] }
        active: { type: boolean }

    # ------------------------------------------------------------ 대피 상황 · 현황 (A12, A14, B13)
    StatusCounts:
      type: object
      required: [total, no_response, evacuating, evacuated, need_help]
      properties:
        total: { type: integer }
        no_response: { type: integer }
        evacuating: { type: integer }
        evacuated: { type: integer }
        need_help: { type: integer }
        visited: { type: integer, description: '한 번이라도 방문 기록이 있는 대상 수 (A14)' }
        unvisited_need_help: { type: integer, description: '도움 필요인데 아직 방문 기록이 없는 대상 수 (A14)' }
    Incident:
      type: object
      required: [id, hazard, level, title, source, started_at, summary]
      properties:
        id: { type: string, format: uuid }
        hazard: { $ref: '#/components/schemas/Hazard' }
        level: { $ref: '#/components/schemas/RiskLevel' }
        title: { type: string, examples: ['호우경보 · 구룡포환승센터 일대 침수'] }
        source: { type: string, enum: [auto, manual, simulated] }
        area_id: { type: [integer, 'null'], description: '자동 생성이면 원인 위험 영역 (risk_assessments.id)' }
        started_at: { type: string, format: date-time }
        closed_at: { type: [string, 'null'], format: date-time }
        summary: { $ref: '#/components/schemas/StatusCounts' }
    IncidentInput:
      type: object
      required: [hazard, level, title, area]
      properties:
        hazard: { $ref: '#/components/schemas/Hazard' }
        level: { type: string, enum: [advisory, warning, critical] }
        title: { type: string }
        area:
          description: '원(center + radius_m) 또는 GeoJSON Polygon/MultiPolygon'
          oneOf:
            - type: object
              required: [center, radius_m]
              properties:
                center: { $ref: '#/components/schemas/LatLng' }
                radius_m: { type: number, minimum: 50, maximum: 5000 }
            - type: object
              required: [type, coordinates]
              properties:
                type: { type: string, enum: [Polygon, MultiPolygon] }
                coordinates: { type: array }
        message: { type: string, description: '대피 확인 경고 본문 (생략 시 서버 기본 문장)' }
    PriorityReason:
      type: object
      required: [factor, points, label]
      properties:
        factor: { type: string, examples: [need_help, no_response, living_alone, mobility_limited, landslide_zone, level] }
        points: { type: number }
        label: { type: string, examples: ['도움 요청', '독거', '산사태 위험지도 1등급 40m'] }
    IncidentTarget:
      type: object
      required: [id, kind, label, location, status, priority_rank]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [household, app_user], description: 'household 등록 가구 / app_user 가구 등록 없이 경고를 받은 앱 사용자' }
        household_id: { type: [string, 'null'], format: uuid }
        label: { type: string, description: 'app_user 는 "앱 사용자 (가구 미등록)"' }
        address: { type: [string, 'null'] }
        location: { $ref: '#/components/schemas/LatLng' }
        phone: { type: [string, 'null'] }
        needs: { type: array, items: { $ref: '#/components/schemas/HouseholdNeed' } }
        has_app: { type: boolean }
        status: { $ref: '#/components/schemas/EvacStatus' }
        status_via: { oneOf: [ { $ref: '#/components/schemas/ResponseVia' }, { type: 'null' } ] }
        status_at: { type: [string, 'null'], format: date-time }
        minutes_since_alert: { type: integer, description: '경고 후 경과 분 (미응답 판단용)' }
        reminder_count: { type: integer }
        escalated: { type: boolean, description: '미응답·도움 필요로 방재단에게 넘어옴' }
        assigned_to: { oneOf: [ { type: 'null' }, { type: object, properties: { user_id: { type: string, format: uuid }, nickname: { type: [string, 'null'] }, is_me: { type: boolean } } } ] }
        priority_rank: { type: integer, minimum: 1, description: '1 = 가장 먼저 방문' }
        priority_score: { type: [number, 'null'], description: 'B13 점수 (없으면 기본 순서)' }
        priority_reasons: { type: array, items: { $ref: '#/components/schemas/PriorityReason' } }
        last_location: { oneOf: [ { $ref: '#/components/schemas/LatLng' }, { type: 'null' } ] }
        note: { type: [string, 'null'] }
        last_visit: { oneOf: [ { $ref: '#/components/schemas/VisitLog' }, { type: 'null' } ] }
    IncidentDetail:
      allOf:
        - $ref: '#/components/schemas/Incident'
        - type: object
          required: [rules, targets, server_time, next_poll_sec]
          properties:
            area: { type: object, description: 'GeoJSON MultiPolygon' }
            rules:
              type: object
              description: '대피 확인 시간 규칙 (분). 2026-10-03 팀 결정 — 근거 정리 중 (8-판단기준-근거현황 4절)'
              properties:
                reminder_interval_min: { type: integer, examples: [2], description: '미응답이면 이 간격으로 반복해서 다시 알림 (방재단에 넘길 때까지)' }
                escalate_after_min: { type: integer, examples: [10], description: '미응답이면 경고 후 이 시간 뒤 방재단에게 넘김' }
                evacuating_recheck_min: { type: integer, examples: [10], description: '대피 중이면 이 시간 뒤 다시 확인' }
            targets:
              type: array
              description: '위험 영역 안 대상, priority_rank 순'
              items: { $ref: '#/components/schemas/IncidentTarget' }
            server_time: { type: string, format: date-time }
            next_poll_sec: { type: integer, examples: [10] }
    TargetPatch:
      type: object
      properties:
        status: { type: string, enum: [evacuated, evacuating, need_help] }
        assigned_to: { type: [string, 'null'], description: '"me" = 나에게 지정, null = 지정 해제' }
        note: { type: [string, 'null'], maxLength: 300 }
    VisitInput:
      type: object
      required: [result]
      properties:
        result: { type: string, enum: [evacuated_with_help, already_evacuated, refused, not_home, transported, other] }
        status_after: { type: string, enum: [evacuated, evacuating, need_help], description: '생략 시 result 로 정함 (함께 대피·이송·이미 대피 → evacuated)' }
        location: { $ref: '#/components/schemas/LatLng' }
        note: { type: string, maxLength: 300 }
    VisitLog:
      type: object
      required: [id, visited_at, result]
      properties:
        id: { type: integer }
        household_id: { type: [string, 'null'], format: uuid, description: '가구 등록 없는 앱 사용자 방문이면 null (target_id 로 연결)' }
        target_id: { type: [string, 'null'], format: uuid }
        responder: { type: object, properties: { user_id: { type: string, format: uuid }, nickname: { type: [string, 'null'] } } }
        visited_at: { type: string, format: date-time }
        result: { type: string, enum: [evacuated_with_help, already_evacuated, refused, not_home, transported, other] }
        status_after: { oneOf: [ { $ref: '#/components/schemas/EvacStatus' }, { type: 'null' } ] }
        note: { type: [string, 'null'] }
    AdminOverview:
      type: object
      required: [households_total, needs_counts, active_incidents, server_time]
      properties:
        role: { $ref: '#/components/schemas/Role' }
        households_total: { type: integer }
        needs_counts: { type: object, additionalProperties: { type: integer }, description: 'HouseholdNeed → 가구 수' }
        with_app: { type: integer, description: '본인 앱 등록 가구 수' }
        active_incidents: { type: array, items: { $ref: '#/components/schemas/Incident' } }
        server_time: { type: string, format: date-time }

    # ------------------------------------------------------------ ai 서비스 (B) — 원본 ai/guardian_ai/service.py · state.py
    AiLocation:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number }
        lon: { type: number }
        label: { type: [string, 'null'], description: '"집", "직장" 등' }
    AiUserProfile:
      type: object
      required: [user_id]
      properties:
        user_id: { type: string }
        user_type: { type: string, enum: [resident, tourist], default: resident }
        home: { oneOf: [ { $ref: '#/components/schemas/AiLocation' }, { type: 'null' } ] }
        age: { type: [integer, 'null'] }
        mobility: { type: [string, 'null'], enum: [walk, car, wheelchair, public_transport, null], description: 'api 의 public_transit 과 철자가 다름' }
        frequent_places: { type: array, items: { $ref: '#/components/schemas/AiLocation' } }
        has_dependents: { type: [boolean, 'null'] }
        walking_impaired: { type: [boolean, 'null'] }
        visual_impaired: { type: [boolean, 'null'] }
        hearing_impaired: { type: [boolean, 'null'] }
        blood_type: { type: [string, 'null'] }
        occupation: { type: [string, 'null'], examples: ['어업(선박 보유)'] }
        emergency_contact: { type: [string, 'null'] }
    AiChatRequest:
      type: object
      required: [user_id, question]
      properties:
        user_id: { type: string, description: '기기별 사용자 ID (Firebase uid 연결은 예정)' }
        question: { type: string }
        profile: { oneOf: [ { $ref: '#/components/schemas/AiUserProfile' }, { type: 'null' } ] }
        current_location: { oneOf: [ { $ref: '#/components/schemas/AiLocation' }, { type: 'null' } ] }
        conversation_id: { type: [string, 'null'], description: '없으면 새 대화. 마지막 문답 후 60분 지나면 새 대화' }
        remember: { type: boolean, default: true, description: '사용자 기억(대화를 넘는 사실) 저장·사용' }
    AiChatResponse:
      type: object
      required: [conversation_id, answer]
      properties:
        conversation_id: { type: string }
        answer: { type: string }
        selected_agents:
          type: array
          items: { type: string, enum: [landslide_agent, rain_flood_agent, wind_typhoon_agent, life_safety_agent, location_route_agent] }
        phase: { type: string, enum: [before, during, after, none], default: none }
        used_fallback: { type: boolean }
        route:
          oneOf:
            - type: 'null'
            - type: object
              required: [destination, profile, distance_m, duration_s, geometry]
              properties:
                destination:
                  type: object
                  properties:
                    name: { type: string }
                    lat: { type: number }
                    lon: { type: number }
                    kind: { type: string, enum: [shelter, medical, home, work, place] }
                profile: { type: string }
                distance_m: { type: integer }
                duration_s: { type: integer }
                avoided: { type: array, items: { type: string } }
                still_inside: { type: array, items: { type: string } }
                hazards_ok: { type: boolean }
                geometry: { type: string, description: 인코딩 polyline }
        call_emergency: { type: boolean, description: '위험 지역에서 이동이 어려움 → 앱이 119 버튼을 크게' }
        decision_path: { type: string, examples: ['재난 중 > 위험 지역 > 이동 가능'], description: '행동 권고 판단 로직에서 도달한 분기' }
        follow_up: { type: [string, 'null'], description: '판단에 필요한 추가 질문 (답 끝에도 "확인할게요: …"로 붙음)' }
        voice_text: { type: string, description: '음성으로 읽을 2~3문장 (/api/tts 에 그대로)' }
        card:
          oneOf:
            - type: 'null'
            - type: object
              description: '카드형 표시용 (값은 모두 근거에서 코드가 고름). 앱 화면 적용은 C 와 협의'
              properties:
                headline: { type: string, examples: ['재난 중 · 위험 지역 · 이동 가능 · 호우·침수 경보'] }
                chips:
                  type: array
                  items: { type: object, properties: { label: { type: string }, value: { type: string } } }
                steps: { type: array, items: { type: string }, description: '지금 할 일' }
                sources: { type: array, items: { type: string } }
                call_emergency: { type: boolean }
        timings: { type: object, additionalProperties: { type: number }, description: '단계별 초 (디버그용, 앱 표시 안 함)' }

    # ------------------------------------------------------------ route 서비스 (B) — 원본 route/guardian_route/service.py
    LatLon:
      type: object
      required: [lat, lon]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }
    RouteProfile:
      type: string
      enum: [adult, elderly]
      description: 'adult 최단 시간(경사 무시) / elderly 급경사(1/18·1/12 초과) 회피·같은 경사면 계단 선호·느린 속도. 휠체어 이용자 → elderly'
    RouteRequest:
      type: object
      required: [origin, destination]
      properties:
        origin: { $ref: '#/components/schemas/LatLon' }
        destination: { $ref: '#/components/schemas/LatLon' }
        profile: { $ref: '#/components/schemas/RouteProfile' }
    RouteResponse:
      type: object
      required: [profile, distance_m, duration_s, geometry]
      properties:
        profile: { $ref: '#/components/schemas/RouteProfile' }
        distance_m: { type: integer }
        duration_s: { type: integer }
        ascend_m: { type: integer }
        descend_m: { type: integer }
        max_slope_pct: { type: integer }
        avoided: { type: array, items: { type: string }, description: '회피 없이 가면 지났을 위험 구역 중 이 경로가 피한 것' }
        still_inside: { type: array, items: { type: string }, description: '다른 길이 없어 지나는 위험 구역 (경고용)' }
        geometry: { type: string, description: '인코딩 polyline (Google, 정밀도 1e5, lat·lon 순)' }
        source: { type: string, default: graphhopper }
        hazards_ok: { type: boolean, description: 'false 면 위험 영역을 못 읽어 회피 없이 계산' }
    RouteCheckRequest:
      type: object
      required: [current, destination, geometry]
      properties:
        current: { $ref: '#/components/schemas/LatLon' }
        destination: { $ref: '#/components/schemas/LatLon' }
        geometry: { type: string, description: '지금 안내 중인 경로 (직전 응답의 geometry)' }
        profile: { $ref: '#/components/schemas/RouteProfile' }
    RouteCheckResponse:
      type: object
      required: [reroute, off_route_m]
      properties:
        reroute: { type: boolean }
        reasons: { type: array, items: { type: string, enum: [off_route, hazard_on_route] } }
        off_route_m: { type: integer }
        hazards_ahead: { type: array, items: { type: string } }
        arrived: { type: boolean }
        route: { oneOf: [ { $ref: '#/components/schemas/RouteResponse' }, { type: 'null' } ] }
    SeaRouteRequest:
      type: object
      description: '[B11 1차] 좌표 키는 route 서버 규칙(lat, lon)'
      required: [origin]
      properties:
        origin: { $ref: '#/components/schemas/LatLon' }
        destination: { oneOf: [ { $ref: '#/components/schemas/LatLon' }, { type: 'null' } ], description: '생략 시 항구(육지면 출발지)에서 가장 가까운 갈 만한 대피소' }
        profile: { $ref: '#/components/schemas/RouteProfile' }
    SeaRouteResponse:
      type: object
      description: '[B11 1차] 해상 구간과 육상 구간을 나눠서 준다'
      required: [at_sea]
      properties:
        at_sea: { type: boolean, description: '출발 좌표가 해상인지 (OSM 해안선, 물가 30m 는 육지)' }
        port:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                id: { type: string, examples: ['guryongpo'] }
                name: { type: string }
                kind: { type: string, enum: [national_fishing, local_fishing, village_fishing, small_port, other] }
                berth: { $ref: '#/components/schemas/LatLon' }
                land_point: { $ref: '#/components/schemas/LatLon' }
        sea_leg:
          oneOf:
            - type: 'null'
            - type: object
              required: [distance_m, bearing_deg, bearing_label, direct]
              properties:
                distance_m: { type: integer, description: '직선 거리' }
                bearing_deg: { type: number, description: '진북 기준 방위 (0~360)' }
                bearing_label: { type: string, examples: ['북서쪽'] }
                direct: { type: boolean, description: 'false 면 직선 항로가 곶·방파제를 가로지른다 (해안을 돌아가야 함)' }
                alternatives:
                  type: array
                  description: '다음 항구 최대 2곳 (직선 항로가 열린 곳)'
                  items: { type: object, properties: { id: { type: string }, name: { type: string }, distance_m: { type: integer }, bearing_deg: { type: number }, bearing_label: { type: string } } }
        destination:
          oneOf:
            - type: 'null'
            - type: object
              properties:
                name: { type: [string, 'null'], description: '자동 선택한 대피소 이름 (직접 준 목적지면 null)' }
                lat: { type: number }
                lon: { type: number }
                note: { type: [string, 'null'], description: '갈 만한 대피소가 없을 때 경고' }
        land_route: { oneOf: [ { $ref: '#/components/schemas/RouteResponse' }, { type: 'null' } ] }
        land_route_error: { type: [string, 'null'] }
