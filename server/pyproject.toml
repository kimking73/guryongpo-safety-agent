[project]
name = "guardian-server"
version = "0.3.0"
description = "구룡가디언 FastAPI 서버 · 데이터 수집기 · 위험 판정 엔진 (A)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "APScheduler>=3.10,<4",
    "firebase-admin>=6.5",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    # slim 이미지에 시간대 DB 가 없어 Asia/Seoul 스케줄이 깨지는 것 방지
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8", "PyYAML", "jsonschema"]

[tool.setuptools]
packages = ["app", "collector", "risk", "alerts", "loader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
