[project]
name = "guardian-route"
version = "0.1.0"
description = "구룡가디언 경로 안내 서버 (GraphHopper 앞단)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# 위험 구역 회피 시연 그림 (scripts/avoid_demo.py). 서비스 이미지에는 안 들어간다
demo = ["matplotlib>=3.8", "pillow>=10", "osmium>=4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["guardian_route"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# live: 실행 중인 graphhopper 컨테이너(localhost:8989)를 부르는 테스트. 기본 실행에서 제외, `pytest -m live`로 따로 돌린다
markers = ["live: 실제 GraphHopper 호출 (docker compose up 필요)"]
addopts = "-m 'not live'"
