# 구룡가디언 서비스 구성 (로컬·서버 공통)
#
# 로컬:  docker compose up -d --build
#        → docker-compose.override.yml이 자동으로 합쳐져 DB 포트 노출, 코드 자동 재시작이 켜진다.
# 서버:  docker compose -f docker-compose.yml up -d --build
#        → override를 빼서 DB가 외부에 열리지 않는다. (B10 VM, A9 배포)
#
# 환경마다 다른 값은 전부 루트 .env에서 읽는다. 값을 여기에 직접 쓰지 않는다.
# 위험 판정(risk)은 collector 안에서 10분마다 돈다.
# 정적 데이터(대피소·의료시설·위험지역·행동요령·판정 기준) 다시 적재: docker compose run --rm loader (A7)

# 폴더 이름(코드)이 한글이라 자동 이름이 비므로 직접 지정한다. 컨테이너·볼륨 이름 앞에 붙는다.
name: guardian

services:
  db:
    # 공식 postgis/postgis 이미지는 arm64(Apple Silicon)를 지원하지 않아 멀티 아키텍처 미러를 쓴다.
    image: imresamu/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?.env에 DB_USER가 필요합니다}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD가 필요합니다}
      POSTGRES_DB: ${DB_NAME:?.env에 DB_NAME이 필요합니다}
      # db/init/07_ai_readonly.sh가 AI 전용 읽기 전용 계정을 만들 때 쓴다 (비어 있으면 건너뜀)
      AI_DB_USER: ${AI_DB_USER:-guardian_ai}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:-}
      # db/init/08_ai_memory.sh가 AI 기억 저장 계정·ai_memory 스키마를 만들 때 쓴다 (비어 있으면 건너뜀)
      AI_MEM_DB_USER: ${AI_MEM_DB_USER:-guardian_ai_mem}
      AI_MEM_DB_PASSWORD: ${AI_MEM_DB_PASSWORD:-}
    volumes:
      - db-data:/var/lib/postgresql/data
      # 볼륨이 비어 있을 때 한 번만 이름 순서대로 실행: 00 PostGIS → 01 스키마 → 02~06 시드 (A1·A7) → 07 AI 읽기 전용 계정 (B3) → 08 AI 기억 저장 계정
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    # 앱·웹이 부르는 REST API (A2~). 배포 시 Caddy가 /api/chat·/api/route 외의 /api를 여기로 넘긴다 (B10, deploy/Caddyfile).
    build: ./server
    restart: unless-stopped
    env_file: .env
    environment:
      # 컨테이너끼리는 서비스 이름(db)과 내부 포트(5432)로 접속한다.
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      # /api/health 에 함께 표시할 다른 서비스 (꺼져 있으면 down 으로만 표시, api 는 영향 없음)
      ROUTE_HEALTH_URL: http://route:8002/api/route/health
      AI_HEALTH_URL: http://ai:8001/api/ai/health
    volumes:
      # Firebase 서비스 계정 키 (.env 의 FIREBASE_CREDENTIALS=secrets/firebase-admin.json)
      - ./secrets:/srv/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  collector:
    # 데이터 수집기 + 위험 판정 (A2·A3). api 와 같은 이미지, 명령만 다름. 포트 없음.
    # 포항 디지털 트윈·기상청을 10분마다 받아 DB에 쌓고, 수위 수집 1분 뒤 침수 위험을 판정한다.
    build: ./server
    command: ["python", "-m", "collector"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    volumes:
      # Firebase 서비스 계정 키 — 선제 경고 FCM 발송 (A5). 없으면 발송만 건너뛰고 경고는 폴링으로 전달
      - ./secrets:/srv/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # 최근 30분 안에 성공한 수집이 하나도 없으면 unhealthy (외부 API 전체 장애·키 오류 감지)
      test: ["CMD", "python", "-m", "collector", "--health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  loader:
    # 정적 데이터 적재 (A7). 한 번 돌고 끝나는 작업이라 `up` 에 포함하지 않는다 (profiles).
    #   docker compose run --rm loader            → db/init 02~ 시드를 다시 적용 (관측값·사용자 데이터는 유지)
    #   빈 DB(initdb 미실행)면 00·01 스키마부터 만든다. 여러 번 실행해도 결과가 같다.
    # 상주 서비스가 아니므로 restart·healthcheck 없음 (결과는 종료 코드와 ingest_runs 의 loader 기록)
    build: ./server
    command: ["python", "-m", "loader"]
    profiles: ["tools"]
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    volumes:
      - ./db/init:/srv/db/init:ro
    depends_on:
      db:
        condition: service_healthy

  ai:
    # LangGraph 멀티 agent + OpenAI. 배포 시 Caddy가 /api/chat을 여기로 넘긴다 (B10).
    build: ./ai
    restart: unless-stopped
    env_file: .env
    environment:
      # request_route tool이 부르는 경로 안내 서버. 꺼져 있어도 ai는 뜨고, 경로만 "지금 안내 불가"로 답한다.
      ROUTE_URL: http://route:8002
      # 앱 시연 모드 대화(ChatRequest.demo)가 시연 데이터(/api/v1/demo/*)를 받는 api 서버 (guardian_ai/demo.py)
      API_URL: http://api:8000
      # DB는 읽기 전용 계정(AI_DB_USER)으로 직접 조회한다 (B3). 계정·비밀번호·DB 이름은 .env
      AI_DB_HOST: db
      AI_DB_PORT: "5432"
    volumes:
      # OpenAI 사용량·예상 비용 기록(openai_usage.json). 재시작·재빌드해도 남는다
      - ai-data:/srv/data
      # 음성(B5) Google 서비스 계정 키 (.env 의 GCP_VOICE_CREDENTIALS=secrets/gcp-voice.json). 없으면 음성만 503
      - ./secrets:/srv/secrets:ro
    ports:
      - "${AI_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/ai/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  graphhopper:
    # 경로 엔진 (B6). 첫 실행 전에 ./graphhopper/fetch_osm.sh로 도로망 파일을 받아 둔다.
    # 포트를 열지 않는다. route 서비스만 컨테이너 안에서 http://graphhopper:8989로 부른다.
    build: ./graphhopper
    restart: unless-stopped
    volumes:
      - ./graphhopper/data:/data      # guryongpo.osm.pbf와 그래프 캐시
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8989/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s               # 캐시가 없으면 시작할 때 그래프를 만든다

  route:
    # 경로 안내 서버 (B6). 배포 시 Caddy가 /api/route를 여기로 넘긴다 (B10).
    build: ./route
    restart: unless-stopped
    env_file: .env
    environment:
      GRAPHHOPPER_URL: http://graphhopper:8989
      # 피할 위험 구역 = 판정 엔진 영역 (GET /api/v1/risk/areas). api가 꺼져 있어도 route는 뜨고, 회피 없이 계산한다
      ROUTE_RISK_API_URL: http://api:8000
    depends_on:
      graphhopper:
        condition: service_healthy
    ports:
      - "${ROUTE_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/api/route/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  caddy:
    # 배포 입구 (B10): HTTPS 인증서 자동 발급 + 경로별로 api·ai·route·웹앱에 나눠 준다. 규칙은 deploy/Caddyfile.
    # 서버에서만 켠다 (profiles). VM .env 의 COMPOSE_PROFILES=deploy 로 `up` 에 포함된다. 로컬 `up` 에는 뜨지 않는다.
    image: caddy:2-alpine
    profiles: ["deploy"]
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Flutter 웹 빌드 결과 (deploy/push_web.sh 가 채운다, gitignore)
      - ./deploy/web:/srv/web:ro
      # 인증서·계정 키 보관. 지우면 재발급 (Let's Encrypt 주간 발급 한도 주의)
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      ai:
        condition: service_healthy
      route:
        condition: service_healthy
    healthcheck:
      # localhost 는 IPv6(::1)로 풀려 관리 포트(127.0.0.1:2019)에 닿지 않는다
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
  ai-data:
  caddy-data:
  caddy-config:
