# 구룡가디언 서비스 구성 (로컬·서버 공통)
#
# 로컬:  docker compose up -d --build
#        → docker-compose.override.yml이 자동으로 합쳐져 DB 포트 노출, 코드 자동 재시작이 켜진다.
# 서버:  docker compose -f docker-compose.yml up -d --build
#        → override를 빼서 DB가 외부에 열리지 않는다. (B10 VM, A9 배포)
#
# 환경마다 다른 값은 전부 루트 .env에서 읽는다. 값을 여기에 직접 쓰지 않는다.
# risk, collector, loader 서비스는 각 담당 작업에서 추가한다.

# 폴더 이름(코드)이 한글이라 자동 이름이 비므로 직접 지정한다. 컨테이너·볼륨 이름 앞에 붙는다.
name: guardian

services:
  db:
    # 공식 postgis/postgis 이미지는 arm64(Apple Silicon)를 지원하지 않아 멀티 아키텍처 미러를 쓴다.
    image: imresamu/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?.env에 DB_USER가 필요합니다}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD가 필요합니다}
      POSTGRES_DB: ${DB_NAME:?.env에 DB_NAME이 필요합니다}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # 볼륨이 비어 있을 때 한 번만 실행
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./server
    restart: unless-stopped
    env_file: .env
    environment:
      # 컨테이너끼리는 서비스 이름(db)과 내부 포트(5432)로 접속한다.
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  ai:
    # LangGraph 멀티 agent + Gemini. 배포 시 Caddy가 /api/chat을 여기로 넘긴다 (B10).
    build: ./ai
    restart: unless-stopped
    env_file: .env
    environment:
      # request_route tool이 부르는 경로 안내 서버. 꺼져 있어도 ai는 뜨고, 경로만 "지금 안내 불가"로 답한다.
      ROUTE_URL: http://route:8002
    ports:
      - "${AI_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/ai/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  graphhopper:
    # 경로 엔진 (B6). 첫 실행 전에 ./graphhopper/fetch_osm.sh로 도로망 파일을 받아 둔다.
    # 포트를 열지 않는다. route 서비스만 컨테이너 안에서 http://graphhopper:8989로 부른다.
    build: ./graphhopper
    restart: unless-stopped
    volumes:
      - ./graphhopper/data:/data      # guryongpo.osm.pbf와 그래프 캐시
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8989/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s               # 캐시가 없으면 시작할 때 그래프를 만든다

  route:
    # 경로 안내 서버 (B6). 배포 시 Caddy가 /api/route를 여기로 넘긴다 (B10).
    build: ./route
    restart: unless-stopped
    env_file: .env
    environment:
      GRAPHHOPPER_URL: http://graphhopper:8989
    depends_on:
      graphhopper:
        condition: service_healthy
    ports:
      - "${ROUTE_PORT:-8002}:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/api/route/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
